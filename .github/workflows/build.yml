name: Build Desktop Executables (Windows & Linux)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MYST-Chatbot-Windows
            zip_file: MYST-Windows.zip
            build_cmd: pyinstaller --noconsole --onedir --collect-all customtkinter --name MYST_Chatbot main.py
            output_dir: dist/MYST_Chatbot

          - os: ubuntu-latest
            artifact_name: MYST-Chatbot-Linux
            zip_file: MYST-Linux.tar.gz
            build_cmd: pyinstaller --noconsole --onedir --collect-all customtkinter --name MYST_Chatbot main.py
            output_dir: dist/MYST_Chatbot

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk libx11-dev zip

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable with PyInstaller
      run: ${{ matrix.build_cmd }}

    - name: Compress Build Output (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path ${{ matrix.output_dir }}/* -DestinationPath ${{ matrix.zip_file }}

    - name: Compress Build Output (Linux)
      if: runner.os == 'Linux'
      run: tar -czvf ${{ matrix.zip_file }} -C dist MYST_Chatbot

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.zip_file }}
